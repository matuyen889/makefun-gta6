<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CALETA DEL SOL 3D — Sun-Soaked Open-World Crime</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0d14;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    user-select: none;
  }
  #container {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  #webgl-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #hud-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #ui-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    pointer-events: auto;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
<script src="./vendor/three.min.js"></script>
</head>
<body>
<div id="container">
  <canvas id="webgl-canvas" aria-label="Caleta del Sol 3D Open World View"></canvas>
  <canvas id="hud-canvas" aria-label="Caleta del Sol Heads Up Display"></canvas>
  <div id="ui-container"></div>
</div>
<p id="status" role="status" aria-live="polite">Caleta del Sol 3D loaded</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
