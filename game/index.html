<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caleta del Sol 3D — Open World</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #090d16; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; }
    #webgl-canvas { width: 100%; height: 100%; display: block; }
    #hud-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #ui-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="webgl-canvas"></canvas>
    <canvas id="hud-canvas"></canvas>
    <div id="ui-overlay"></div>
  </div>
  <script src="./vendor/three.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
